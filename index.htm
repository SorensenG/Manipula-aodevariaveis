<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon"
        href="https://png.pngtree.com/png-clipart/20230508/original/pngtree-color-palette-flat-icon-png-image_9150884.png"
        type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulçao de variaveis css</title>
</head>

<body>
    <h1>Manipule as variaveis CSS com <p>JS</p>
    </h1>
    <div class="controls">

        <label for="spacing">Borda</label>
        <input type="range" min="0" max="200" value="10" name="spacing" data-sizing="px">

        <label for="blur">Blur</label>
        <input type="range" min="0" max="200" name="blur" value="0" data-sizing="px">

        <label for="size">Tamanho</label>
        <input type="range" min="10" max="1000" value="400"name="size" data-sizing="px">

        <label for="color">Cor</label>
        <input type="color" name="color" class="cor">

    </div>

    <img src="https://i.pinimg.com/474x/19/22/9d/19229d78aa73ae169bf5b3a55d735cbb.jpg" alt="">


    <script src="script.js"></script>
</body>

</html>
